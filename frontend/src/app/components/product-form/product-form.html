<div class="container">
  <h2>{{ isEditMode ? 'Editar Producto' : 'Nuevo Producto' }}</h2>

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="sku">SKU</label>
      <input type="text" id="sku" name="sku" [(ngModel)]="product.sku" required />
    </div>

    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" [(ngModel)]="product.nombre" required />
    </div>

    <div class="form-group">
      <label for="precio">Precio</label>
      <input type="number" id="precio" name="precio" [(ngModel)]="product.precio" required min="0" step="0.01" />
    </div>

    <div class="form-group">
      <label for="cantidad">Cantidad</label>
      <input type="number" id="cantidad" name="cantidad" [(ngModel)]="product.cantidad" required min="0" />
    </div>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <div class="actions">
      <button type="submit">{{ isEditMode ? 'Actualizar' : 'Crear' }}</button>
      <button type="button" (click)="cancel()">Cancelar</button>
    </div>
  </form>
</div>
